name: Android build and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          fi

      - name: Run tests and build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -f "$RUNNER_TEMP/release.jks" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew test assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothJammer-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: BluetoothJammer-${{ github.sha }}
          path: release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="$(find release -type f -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "No release APK found"
            exit 1
          fi

          release_apk="BluetoothJammer-${GITHUB_REF_NAME}.apk"
          cp "$apk" "$release_apk"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "$release_apk" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "$release_apk" \
              --title "BluetoothJammer ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
